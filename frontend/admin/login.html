<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Portal | The Grand Hotel</title>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/variables.css?v=3">
  <link rel="stylesheet" href="/css/theme.css?v=3">
  <link rel="stylesheet" href="/css/admin.css?v=3">
</head>
<body class="login-page">
  <button class="theme-toggle-btn header-theme-toggle" onclick="utils.toggleTheme()" title="Switch Theme" aria-label="Toggle Bright/Dark Mode">🌙</button>

  <div class="login-card">
    <div class="login-logo">
      <div class="login-crest">GH</div>
      <h1 class="login-title">Staff Portal</h1>
      <p class="login-sub">The Grand Hotel &amp; Suites — Management Console</p>
    </div>

    <div id="login-error" class="login-error">Invalid credentials. Please verify your email and password.</div>

    <form id="login-form" class="login-form" onsubmit="event.preventDefault(); auth.login()">
      <div class="form-group">
        <label class="form-label" for="email">Staff Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="admin@hotel.com" required autofocus autocomplete="username">
      </div>
      
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
      </div>
      
      <button type="submit" id="login-btn" class="btn btn-primary btn-block btn-lg" style="margin-top:var(--sp-2);">
        Sign In to Portal
      </button>
    </form>
  </div>

  <script src="/js/utils.js?v=5"></script>
  <script src="/js/api.js?v=5"></script>
  <script src="/js/admin/auth.js?v=5"></script>
</body>
</html>
